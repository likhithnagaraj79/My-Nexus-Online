spring:
  datasource:
    url: jdbc:h2:mem:exhibitor_registration_test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: test-only-jwt-signing-secret-not-for-production-use-0123456789
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7
  cors:
    allowed-origins: http://localhost:5173
  public-frontend-base-url: http://localhost:5173/register/
  public-frontend-delegate-base-url: http://localhost:5173/register-delegate/
  recaptcha:
    enabled: false
    secret-key: test-secret
  totp:
    enabled: true
  admin-bootstrap:
    username:
    password:
