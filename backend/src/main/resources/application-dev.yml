server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore/dev-keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: exhibitor-dev

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/exhibitor_registration_dev
    username: ${DB_USERNAME:exhibitor_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7
  cors:
    allowed-origins: https://localhost:5173
  public-frontend-base-url: https://localhost:5173/register/
  recaptcha:
    enabled: true
    secret-key: ${RECAPTCHA_SECRET_KEY:}
  admin-bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
