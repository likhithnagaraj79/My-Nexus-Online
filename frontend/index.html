<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exhibitor Registration System</title>

  <body>
    <div id="root"></div>
    <!-- Crew's badge print content portals here (see ExhibitorPassesPage.tsx) instead of
         rendering nested inside #root. Printing hides #root entirely via display:none — the
         only way to keep the rest of the app's markup (nav, DataGrid, dialogs, etc.) from
         contributing to the print engine's page-height calculation, which visibility:hidden
         does NOT do (it keeps hidden elements in layout, still occupying space). -->
    <div id="badge-print-portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
